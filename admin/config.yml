backend:
  name: github
  repo: alzari555/portafolios
  branch: main

# Soporte para proxy local si se ejecuta npx @sveltia/cms-proxy
local_backend: true

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "proyectos"
    label: "Proyectos del Portafolio"
    editor:
      preview: false
    files:
      - label: "Gestor de Proyectos"
        name: "proyectos"
        file: "data/proyectos.json"
        description: "Añade, edita y organiza los proyectos que aparecerán en la grilla del portafolio."
        fields:
          - label: "Proyectos"
            name: "items"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Descripción", name: "description", widget: "text"}
              - {label: "Imagen Principal", name: "image", widget: "image"}
              - {label: "Formato en Grilla", name: "format", widget: "select", options: [{label: "Cuadrada", value: "square"}, {label: "Vertical", value: "portrait"}, {label: "Horizontal", value: "landscape"}], default: "square"}
              - {label: "Forma de la imagen (Solo formato cuadrado)", name: "image_shape", widget: "select", options: [{label: "Esquina truncada", value: "quarter-circle-tr"}, {label: "Forma orgánica (Blob)", value: "blob-shape"}, {label: "Sin efecto", value: "none"}], default: "none", required: false}
              - {label: "Presentación PDF (Extrae diapositivas automáticamente)", name: "pdf_file", widget: "file", required: false}
              - label: "Galería Adicional (Opcional)"
                name: "gallery"
                widget: "list"
                required: false
                fields:
                  - {label: "Imagen Extra", name: "image", widget: "image"}
